<app-resources></app-resources>
<app-anchored-tool-tip></app-anchored-tool-tip>
<app-save-modal></app-save-modal>
<app-toast [toast]="toastSignal()" [close]="closeToast"></app-toast>

<div [class]="appToolBarClassName()" role="toolbar" aria-label="Application toolbar">
  <div class="app-tool-bar-inner">
    <app-tool-bar></app-tool-bar>
  </div>
</div>

<div class="app-panel-outer">
  <div class="app-panel">
    <div class="app-panel-inner">
      <div [class]="appTabBarClassName()" role="tablist" aria-label="Document tabs">
        <div class="app-tab-bar-inner">
          <app-tab-bar></app-tab-bar>
        </div>
      </div>
      <div [class]="appBodyClassName()">
        <app-graphics-panel></app-graphics-panel>
      </div>
    </div>
  </div>
</div>

<div [class]="appPropertyViewerClassName()" role="complementary" aria-label="Properties pane">
  <div class="app-property-viewer-inner">
    <app-property-viewer></app-property-viewer>
  </div>
</div>
