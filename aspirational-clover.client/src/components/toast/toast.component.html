@if(toast()) {
  <div [class]="toastClassName()" role="status" aria-live="polite">
    <div class="toast-text">{{ toast()?.value ?? "" }}</div>
    <button [class]="buttonClassName()" (click)="close()?.()" aria-label="Close notification" [style.background-color]="'#88888850 !important'" [style.color]="'#000000 !important'">
      <ng-container *ngTemplateOutlet="closeIcon(); context: { width: '16px', height: '16px' }"></ng-container>
    </button>
  </div>
}
