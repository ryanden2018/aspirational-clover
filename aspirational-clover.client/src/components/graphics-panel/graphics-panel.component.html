<svg viewBox="-20 -20 120 120" style="width:100%;height:100%">
  @for (layer of sortedLayers(); track layer.clientUuid) {
    @for (circle of getCircles(layer); track circle.clientUuid) {
      <circle [attr.cx]="circle.centerX" [attr.cy]="circle.centerY" [attr.r]="circle.radius" stroke="#000000" fill="none" />
    }
    @for (rectangle of getRectangles(layer); track rectangle.clientUuid) {
      <rect [attr.x]="rectangle.x" [attr.y]="rectangle.y" [attr.width]="rectangle.width" [attr.height]="rectangle.height" stroke="#000000" fill="none" />
    }
  }
</svg>
