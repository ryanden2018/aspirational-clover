<div class="graphics-panel-svg-container">
  <div class="graphics-panel-svg-container-middle">
    <div class="graphics-panel-svg-container-inner">
      @if (activeDocument() !== null) {
        <svg viewBox="0 0 850 1100" [class]="graphicsPanelSvgClassName()" (mousedown)="onSvgMouseDown($event)" (click)="onSvgClick()" [attr.style.cursor]="isCreatingShape() ? 'crosshair' : 'default'" role="img" aria-label="Drawing canvas" tabindex="0">
          @for (layer of sortedLayers(); track layer.clientUuid) {
            @for (shape of layer.shapes; track getClientUuidFromShape(shape)) {
              @if (typeof shape.circle === "object" && shape.circle !== null) {
                <defs>
                  <linearGradient [attr.id]="getGradientId(shape.circle)" [attr.x1]="getFillX1(shape.circle)" [attr.y1]="getFillY1(shape.circle)" [attr.x2]="getFillX2(shape.circle)" [attr.y2]="getFillY2(shape.circle)">
                    <stop offset="0%" [attr.stop-color]="shape.circle.fillColorFrom" />
                    <stop offset="100%" [attr.stop-color]="shape.circle.fillColorTo !== '' ? shape.circle.fillColorTo : shape.circle.fillColorFrom" />
                  </linearGradient>
                </defs>
                <circle
                        (mousedown)="onCircleMouseDown($event, shape.circle)"
                        (click)="onCircleClick($event, shape.circle)"
                        role="button"
                        [attr.aria-label]="'Circle ' + (shape.circle?.clientUuid ?? '')"
                        tabindex="0"
                        [class]="isCreatingShape() ? 'transformed-elem cursor-crosshair' : 'transformed-elem cursor-grab'"
                        [attr.transform-origin]="getTransformOriginCircle(shape.circle)"
                        [attr.transform]="getTransform(shape.circle)"
                        [attr.cx]="shape.circle.centerX"
                        [attr.cy]="shape.circle.centerY"
                        [attr.r]="shape.circle.radius"
                        [attr.stroke]="selectionOutlineColor()"
                        [attr.fill]="getGradientFillAttr(shape.circle)"
                        [attr.stroke-width]="selectedShapeClientUuid() === shape.circle.clientUuid ? 2 : 0"
                />
              }
              @if (typeof shape.rectangle === "object" && shape.rectangle !== null) {
                <defs>
                  <linearGradient [attr.id]="getGradientId(shape.rectangle)" [attr.x1]="getFillX1(shape.rectangle)" [attr.y1]="getFillY1(shape.rectangle)" [attr.x2]="getFillX2(shape.rectangle)" [attr.y2]="getFillY2(shape.rectangle)">
                    <stop offset="0%" [attr.stop-color]="shape.rectangle.fillColorFrom" />
                    <stop offset="100%" [attr.stop-color]="shape.rectangle.fillColorTo !== '' ? shape.rectangle.fillColorTo : shape.rectangle.fillColorFrom" />
                  </linearGradient>
                </defs>
                <rect
                      (mousedown)="onRectangleMouseDown($event, shape.rectangle)"
                      (click)="onRectangleClick($event, shape.rectangle)"
                      role="button"
                      [attr.aria-label]="'Rectangle ' + (shape.rectangle?.clientUuid ?? '')"
                      tabindex="0"
                      [class]="isCreatingShape() ? 'transformed-elem cursor-crosshair' : 'transformed-elem cursor-grab'"
                      [attr.transform-origin]="getTransformOriginRectangle(shape.rectangle)"
                      [attr.transform]="getTransform(shape.rectangle)"
                      [attr.x]="shape.rectangle.x"
                      [attr.y]="shape.rectangle.y"
                      [attr.width]="shape.rectangle.width"
                      [attr.height]="shape.rectangle.height"
                      [attr.stroke]="selectionOutlineColor()"
                      [attr.fill]="getGradientFillAttr(shape.rectangle)"
                      [attr.stroke-width]="selectedShapeClientUuid() === shape.rectangle.clientUuid ? 2 : 0"
                />
              }
              @if (typeof shape.textBox === "object" && shape.textBox !== null) {
                <text
                      (mousedown)="onTextBoxMouseDown($event, shape.textBox)"
                      (click)="onTextBoxClick($event, shape.textBox)"
                      role="button"
                      [attr.aria-label]="'Text box ' + (shape.textBox?.clientUuid ?? '')"
                      tabindex="0"
                      [class]="isCreatingShape() ? 'cursor-crosshair' : 'cursor-grab'"
                      [attr.x]="shape.textBox.x"
                      [attr.y]="shape.textBox.y"
                      [attr.font-size]="shape.textBox.fontSize"
                      [attr.fill]="textBoxColor()"
                      [attr.stroke]="selectionOutlineColor()"
                      [attr.stroke-width]="selectedShapeClientUuid() === shape.textBox.clientUuid ? 1 : 0"
                      style="user-select:none"
                >{{ getTextBoxText(shape.textBox) }}</text>
              }
            }
          }
        </svg>
      }
    </div>
  </div>
</div>
